name: bga

x-agent-env: &agent-env
  APP_NAME: Fullstack Generation Agent
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DB_URL: postgresql+psycopg://${POSTGRES_USER:-bga}:${POSTGRES_PASSWORD:-bga}@postgres:5432/${POSTGRES_DB:-agent}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, run `make env`}
  SEED_USERS: ${SEED_USERS:-}
  CORS_ORIGINS: http://localhost:${BGA_UI_PORT:-3100}
  RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
  WORKSPACE_ROOT: ${HOST_WORKSPACE_ROOT:?HOST_WORKSPACE_ROOT is required, run `make env`}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  # Empty = all engines; `make up` sets claude_code,fake when a host worker runs Antigravity (account login).
  WORKER_ENGINES: ${DOCKER_WORKER_ENGINES:-}
  DEFAULT_ENGINE: ${DEFAULT_ENGINE:-claude_code}
  ENABLE_FAKE_ENGINE: ${ENABLE_FAKE_ENGINE:-true}
  FAKE_ENGINE_DELAY_SECONDS: ${FAKE_ENGINE_DELAY_SECONDS:-0.3}
  ENGINE_TIMEOUT_SECONDS: ${ENGINE_TIMEOUT_SECONDS:-900}
  ENGINE_MAX_TURNS: ${ENGINE_MAX_TURNS:-40}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  CLAUDE_CODE_MODEL: ${CLAUDE_CODE_MODEL:-}
  CLAUDE_CODE_PURPOSE_MODELS: ${CLAUDE_CODE_PURPOSE_MODELS:-}
  CLAUDE_CREDENTIALS_FILE: /run/bga/claude-credentials.json
  ANTIGRAVITY_AUTH: ${ANTIGRAVITY_AUTH:-gemini_api_key}
  ANTIGRAVITY_MODEL: ${ANTIGRAVITY_MODEL:-}
  ANTIGRAVITY_PURPOSE_MODELS: ${ANTIGRAVITY_PURPOSE_MODELS:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  DRAFT_ENGINE: ${DRAFT_ENGINE:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-}
  ANTIGRAVITY_JSON_EFFORT: ${ANTIGRAVITY_JSON_EFFORT:-}
  CLAUDE_CODE_JSON_EFFORT: ${CLAUDE_CODE_JSON_EFFORT:-}
  CLAUDE_CODE_JSON_MAX_BUDGET_USD: ${CLAUDE_CODE_JSON_MAX_BUDGET_USD:-}
  GEMINI_API_MODEL: ${GEMINI_API_MODEL:-}
  GEMINI_API_THINKING_BUDGET: ${GEMINI_API_THINKING_BUDGET:-}
  FRONTEND_TREES: ${FRONTEND_TREES:-true}
  PREVIEW_AUTH_TOKEN_STORAGE: ${PREVIEW_AUTH_TOKEN_STORAGE:-local}
  BACKEND_TESTS: ${BACKEND_TESTS:-false}
  IMAGE_PROVIDER: ${IMAGE_PROVIDER:-gemini}
  GEMINI_IMAGE_API_KEY: ${GEMINI_IMAGE_API_KEY:-}
  GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-3.1-flash-lite-image}
  GEMINI_IMAGE_SIZE: ${GEMINI_IMAGE_SIZE:-1K}
  GEMINI_IMAGE_PRICE_USD: ${GEMINI_IMAGE_PRICE_USD:-0.0336}
  DRAFT_SPEED: ${DRAFT_SPEED:-thorough}
  FAST_DRAFT_MODELS: ${FAST_DRAFT_MODELS:-}
  UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
  UNSPLASH_APP_NAME: ${UNSPLASH_APP_NAME:-fullstack_generation_agent}
  IMAGE_CONCURRENCY: ${IMAGE_CONCURRENCY:-4}
  IMAGE_TIMEOUT_SECONDS: ${IMAGE_TIMEOUT_SECONDS:-60}
  FRONTEND_MAX_PHOTOS: ${FRONTEND_MAX_PHOTOS:-8}
  VIDEO_PROVIDERS: ${VIDEO_PROVIDERS:-}
  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
  PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
  PIXABAY_STORE_VIDEOS: ${PIXABAY_STORE_VIDEOS:-false}
  ARTIFACT_ROOT: /data/artifacts
  UPLOAD_ROOT: /data/uploads
  PREVIEW_ENABLED: ${PREVIEW_ENABLED:-true}
  PREVIEW_PORT_RANGE: ${PREVIEW_PORT_RANGE:-18000-18099}
  PREVIEW_CORS_ORIGINS: http://localhost:${BGA_UI_PORT:-3100}
  PREVIEW_MAX_RUNNING: ${PREVIEW_MAX_RUNNING:-3}
  PREVIEW_TTL_HOURS: ${PREVIEW_TTL_HOURS:-2}
  INTEGRATION_WAIT_SECONDS: ${INTEGRATION_WAIT_SECONDS:-900}
  LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
  LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
  LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-fullstack-generation-agent}
  LANGSMITH_AGENT_ID: ${LANGSMITH_AGENT_ID:-}
  LANGSMITH_AGENT_ENVIRONMENT: ${LANGSMITH_AGENT_ENVIRONMENT:-local}
  TRACE_RETENTION_DAYS: ${TRACE_RETENTION_DAYS:-30}
  MODEL_PRICES: ${MODEL_PRICES:-{}}

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bga}
      POSTGRES_DB: ${POSTGRES_DB:-agent}
    # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker, so the volume mounts one level up.
    # Published on localhost only, for host-side processes (host worker, tests, dev servers).
    ports:
      - "127.0.0.1:${BGA_PG_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [bga-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${BGA_REDIS_PORT:-6389}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [bga-net]

  agent-api:
    restart: unless-stopped
    build:
      context: ./agent-api
      target: api
    environment: *agent-env
    volumes:
      - ./.data/artifacts:/data/artifacts:ro
      # Story 15.4: users' uploads; the API writes them, the worker copies them into sites.
      - ./.data/uploads:/data/uploads
    ports:
      - "127.0.0.1:${BGA_API_PORT:-8100}:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [bga-net]

  agent-worker:
    restart: unless-stopped
    build:
      context: ./agent-api
      target: worker
      additional_contexts:
        skills: ./.agents/skills
        examples: ./examples
    environment: *agent-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # A host directory (not a volume), so a host dev worker and the Docker API share the same artifacts.
      - ./.data/artifacts:/data/artifacts
      - ./.data/uploads:/data/uploads  # copied into sites; unused ones pruned (UPLOAD_RETENTION_DAYS)
      # Same absolute path inside and outside, so sibling sandbox containers can bind-mount job workspaces.
      - ${HOST_WORKSPACE_ROOT}:${HOST_WORKSPACE_ROOT}
      # Optional Claude subscription login instead of ANTHROPIC_API_KEY (/dev/null = not configured).
      - ${CLAUDE_CREDENTIALS_HOST_FILE:-/dev/null}:/run/bga/claude-credentials.json:ro
    depends_on:
      agent-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/bga-worker.heartbeat') < 30 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [bga-net]

  agent-ui:
    restart: unless-stopped
    build:
      context: ./agent-ui
      additional_contexts:
        examples: ./examples
    environment:
      API_URL: http://agent-api:8000
    ports:
      - "127.0.0.1:${BGA_UI_PORT:-3100}:3000"
    depends_on:
      agent-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [bga-net]

volumes:
  pgdata:
  redisdata:

networks:
  bga-net:
    name: bga-net
